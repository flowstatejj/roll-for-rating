name: verify

# Gates every push and PR: TypeScript typecheck + i18n key-parity check.
# The i18n check fails the build if any t() key is missing from English or if
# es/pt/fr drift out of parity with the English dictionary.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n key-parity check
        run: npm run i18n:check

      - name: TypeScript typecheck
        run: npm run typecheck
